[package]
name = "medstore-pos"
version = "0.1.0"
description = "Bizflow POS — desktop app"
edition = "2021"

[lib]
name = "medstore_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
pos-printer = { path = "../crates/pos-printer" }
pos-server = { path = "../crates/pos-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
